<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeverForgetSL</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-wrapper">
                <a href="index.html" class="brand-logo">NeverForgetSL</a>
                <ul class="nav-links">
                    <li><a href="articles.html">Articles</a></li>
                    <li><a href="categories.html">Categories</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="categories">
            <h2>Categories</h2>
            <div class="category-list" id="categoryList">
                <!-- Categories will be loaded dynamically -->
            </div>
        </section>

        <section class="latest-articles">
            <h2>Latest Articles</h2>
            <div class="article-list" id="latestArticles">
                <!-- Latest articles will be loaded dynamically -->
            </div>
        </section>

        <section class="recently-edited">
            <h2>Recently Updated</h2>
            <div class="article-list" id="recentArticles">
                <!-- Recent articles will be loaded dynamically -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentYear"></span> NeverForgetSL. All rights reserved.</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
